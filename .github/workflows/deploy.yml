name: Deploy to GitHub Pages

on:
  # main に push されたら自動でビルド＆デプロイ
  push:
    branches: [main]
  # Actions タブから手動実行もできる
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          # package.json の engines と合わせる
          node-version: 24
        env:
          # GA4 の測定 ID（リポジトリの Settings > Secrets and variables > Actions > Variables で設定）。
          # 未設定なら GoogleAnalytics.astro がプレースホルダー扱いにして計測タグを出力しない
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
